server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - ${FRONTEND_URL:http://localhost:5173}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      discovery:
        locator:
          enabled: false

      routes:

        # AUTH SERVICE
        - id: auth-service
          uri: https://shorty-auth.onrender.com
          predicates:
            - Path=/auth/**

        # URL SERVICE (CRUD APIs)
        - id: url-service
          uri: https://shorty-url-rzvg.onrender.com
          predicates:
            - Path=/urls/**

        # REDIRECT (IMPORTANT - MUST BE LAST)
        - id: redirect-service
          uri: https://shorty-url-rzvg.onrender.com
          predicates:
            - Path=/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway